spring:
  config:
    import: optional:configtree:${AGENTIC_SDLC_SECRETS_PATH:/run/secrets/}
  application:
    name: agentic-sdlc-platform
  datasource:
    url: ${AGENTIC_SDLC_DATABASE_URL:jdbc:postgresql://localhost:5432/agentic_sdlc}
    username: ${AGENTIC_SDLC_DATABASE_USERNAME:agentic_sdlc}
    password: ${agentic_sdlc_database_password:${AGENTIC_SDLC_DATABASE_PASSWORD:}}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AGENTIC_SDLC_OIDC_ISSUER:}
          audiences: ${AGENTIC_SDLC_OIDC_AUDIENCE:agentic-sdlc-api}
          jwk-set-uri: ${AGENTIC_SDLC_OIDC_JWK_SET_URI:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
  metrics.tags.application: ${spring.application.name}

agentic-sdlc:
  model:
    provider: ${AGENTIC_SDLC_LLM_PROVIDER:deterministic}
    endpoint: ${AGENTIC_SDLC_LLM_ENDPOINT:https://api.openai.com/v1/responses}
    model: ${AGENTIC_SDLC_LLM_MODEL:gpt-5.4}
    api-key: ${OPENAI_API_KEY:}
  security:
    mode: ${AGENTIC_SDLC_SECURITY_MODE:local}
    operator-password: ${agentic_sdlc_operator_password:${AGENTIC_SDLC_OPERATOR_PASSWORD:operator-local}}
    approver-password: ${agentic_sdlc_approver_password:${AGENTIC_SDLC_APPROVER_PASSWORD:approver-local}}
    release-password: ${agentic_sdlc_release_password:${AGENTIC_SDLC_RELEASE_PASSWORD:release-local}}
  repository:
    approved-root: ${AGENTIC_SDLC_APPROVED_REPOSITORY_ROOT:.}
  coordination:
    instance-id: ${AGENTIC_SDLC_INSTANCE_ID:${HOSTNAME:local-instance}}
    lease-duration: ${AGENTIC_SDLC_TASK_LEASE:2m}
    recovery-interval: ${AGENTIC_SDLC_RECOVERY_INTERVAL:15s}
    runtime-root: ${AGENTIC_SDLC_RUNTIME_ROOT:${java.io.tmpdir}/agentic-sdlc-runtime}
    approved-repository-root: ${AGENTIC_SDLC_APPROVED_REPOSITORY_ROOT:.}
server:
  forward-headers-strategy: framework
  ssl:
    enabled: ${AGENTIC_SDLC_TLS_ENABLED:false}
    key-store: ${AGENTIC_SDLC_TLS_KEY_STORE:}
    key-store-password: ${agentic_sdlc_tls_key_store_password:${AGENTIC_SDLC_TLS_KEY_STORE_PASSWORD:}}
    key-store-type: ${AGENTIC_SDLC_TLS_KEY_STORE_TYPE:PKCS12}
