services:
  postgres:
    image: postgres:17-alpine
    container_name: agentic-sdlc-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentic_sdlc}
      POSTGRES_USER: ${POSTGRES_USER:-agentic_sdlc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentic_sdlc_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - agentic-sdlc-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  url-shortener-postgres:
    image: postgres:17-alpine
    container_name: url-shortener-postgres
    environment:
      POSTGRES_DB: ${SHORTENER_POSTGRES_DB:-url_shortener}
      POSTGRES_USER: ${SHORTENER_POSTGRES_USER:-url_shortener}
      POSTGRES_PASSWORD: ${SHORTENER_POSTGRES_PASSWORD:-url_shortener_local}
    ports:
      - "${SHORTENER_POSTGRES_PORT:-5433}:5432"
    volumes:
      - url-shortener-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  agentic-sdlc-postgres-data:
  url-shortener-postgres-data:
